[project]
name = "mi-asistente"
version = "0.1.0"
description = "Plantilla de asistente con Pydantic AI, desplegado como bot de Telegram en Render"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Alex Ojeda Copa" }]
license = "MIT"
dependencies = [
    "pydantic-ai-slim[google,openai,tavily]==2.59.0",
    "pydantic-settings>=2.16,<3",
    "python-telegram-bot[webhooks]>=22,<23",
    "httpx>=0.28,<1",
    "chromadb>=1.5.9,<2",
    "langchain-text-splitters>=1.1,<2",
    "pypdf>=6,<7",
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "huggingface-hub>=2.4,<3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[tool.uv]
package = false # es una aplicación, no una librería
python-preference = "managed" # uv descarga Python 3.14 si tu equipo no lo tiene

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
